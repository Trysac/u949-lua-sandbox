# Grouped so a repository gets a few update PRs a month instead of one per package or action (LESSONS L61):
# vcpkg's builtin-baseline in one weekly PR, and every GitHub Actions update in one monthly PR. A new baseline
# also needs the factory's gates image and CI to check out that vcpkg commit.
version: 2
updates:
  - package-ecosystem: "vcpkg"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
